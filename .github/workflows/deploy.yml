name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/sweet-ptolemy-sqj5rv", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build # v3 -> dist/
      # Publish all versions from one Pages site:
      #   /taste/      -> frozen v1 snapshot
      #   /taste/v2/   -> frozen v2 snapshot
      #   /taste/v3/   -> the current build
      - name: Assemble site
        run: |
          mkdir -p site/v2 site/v3
          cp -r frozen/v1/. site/
          cp -r frozen/v2/. site/v2/
          cp -r dist/. site/v3/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
